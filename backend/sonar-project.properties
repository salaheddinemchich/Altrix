sonar.projectKey=pubsub-kafka-migrator
sonar.projectName=PubSub to Kafka Migrator
sonar.projectVersion=0.1.0
sonar.java.source=21
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=\
  platform-common/src/main,\
  platform-project/src/main,\
  platform-job/src/main,\
  platform-orchestrator/src/main

sonar.tests=\
  platform-common/src/test,\
  platform-project/src/test,\
  platform-job/src/test,\
  platform-orchestrator/src/test

# Compiled classes (required for Java analysis)
sonar.java.binaries=\
  platform-common/build/classes/java/main,\
  platform-project/build/classes/java/main,\
  platform-job/build/classes/java/main,\
  platform-orchestrator/build/classes/java/main

# JaCoCo coverage reports
sonar.coverage.jacoco.xmlReportPaths=\
  platform-common/build/reports/jacoco/test/jacocoTestReport.xml,\
  platform-project/build/reports/jacoco/test/jacocoTestReport.xml,\
  platform-job/build/reports/jacoco/test/jacocoTestReport.xml,\
  platform-orchestrator/build/reports/jacoco/test/jacocoTestReport.xml

# Exclusions from analysis entirely
sonar.exclusions=\
  **/build/**,\
  **/.gradle/**,\
  **/infra/postgres/**,\
  **/*Application.java,\
  **/generated/**

# Adapter and infrastructure layers are covered by integration tests (Testcontainers roadmap).
# Exclude them from the coverage gate so the domain-layer % is what SonarQube measures.
sonar.coverage.exclusions=\
  **/adapter/**,\
  **/infrastructure/**
