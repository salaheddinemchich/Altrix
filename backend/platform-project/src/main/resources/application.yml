server:
  port: 8082

spring:
  application:
    name: platform-project

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:altrix_db}
    username: ${POSTGRES_USER:altrix}
    password: ${POSTGRES_PASSWORD:altrix_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Batch DML — reduces round-trips for bulk insert / update operations
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_project

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

minio:
  endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:password123}
  bucket:
    projects: altrix-projects

kafka:
  topics:
    project-registered: project.registered

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080}

# Issue #74 — workspace where JGit clones repositories.  Each clone gets a
# unique sub-directory; WorkspaceCleanupScheduler (follow-up) sweeps stale ones.
app:
  workspace:
    base-dir:       ${WORKSPACE_BASE_DIR:${java.io.tmpdir}/migrator-workspaces}
    max-size-bytes: ${WORKSPACE_MAX_SIZE_BYTES:524288000}   # 500 MB hard cap

# Issue #89, #91 — GitHub webhook receiver.
# secret: shared secret configured in the GitHub repository's webhook settings;
#         used to verify X-Hub-Signature-256.  Leave blank to fail closed (all
#         deliveries rejected, useful for non-production environments).
# purge:  retention window and cron for WebhookDeliveryPurgeScheduler.
webhook:
  github:
    secret: ${GITHUB_WEBHOOK_SECRET:}
  purge:
    retention-days: ${WEBHOOK_RETENTION_DAYS:30}
    cron:           ${WEBHOOK_PURGE_CRON:0 0 2 * * ?}
