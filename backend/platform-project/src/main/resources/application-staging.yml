# ──────────────────────────────────────────────────────────────────────────────
# Profile: staging  (SPRING_PROFILES_ACTIVE=staging)
# Pre-production on AWS EC2.  All secrets come from EC2 environment variables
# or AWS Secrets Manager injected into the environment — no hard-coded defaults.
# ──────────────────────────────────────────────────────────────────────────────

logging:
  level:
    root: WARN
    com.altrix: INFO

spring:
  datasource:
    url:      jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      pool-name: HikariPool-project-staging

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    clean-disabled: true
    clean-on-validation-error: false

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
