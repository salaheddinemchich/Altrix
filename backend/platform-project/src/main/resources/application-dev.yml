# ──────────────────────────────────────────────────────────────────────────────
# Profile: dev  (SPRING_PROFILES_ACTIVE=dev)
# Local development — Docker Compose infra on localhost.
# Activate with: ./gradlew bootRun --args='--spring.profiles.active=dev'
# ──────────────────────────────────────────────────────────────────────────────

logging:
  level:
    root: INFO
    com.altrix: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false
    clean-on-validation-error: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
