# ──────────────────────────────────────────────────────────────────────────────
# Profile: dev  (SPRING_PROFILES_ACTIVE=dev)
# Local development — Docker Compose infra on localhost.
# ──────────────────────────────────────────────────────────────────────────────

logging:
  level:
    root: INFO
    com.altrix: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    # AI / LangChain4j internals — enable when debugging provider routing
    dev.langchain4j: DEBUG

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false
    clean-on-validation-error: true

  data:
    redis:
      lettuce:
        pool:
          max-active: 4
          max-idle: 2
          min-idle: 1

# In dev, use FREE_FIRST to avoid accidental paid API calls during iteration
ai:
  routing:
    tier-preference: FREE_FIRST
  inter-agent-delay-ms: 2000
