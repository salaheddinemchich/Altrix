server:
  port: 8084

spring:
  application:
    name: platform-orchestrator

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: platform-orchestrator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

kafka:
  topics:
    job-created: migration.job.created
    job-status-update: migration.job.status.update

minio:
  endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:password123}
  bucket:
    projects: migrator-projects

ai:
  providers:
    groq:
      enabled: true
      api-key: ${GROQ_API_KEY:${AI_PROVIDER_API_KEY:}}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model-analysis: ${GROQ_MODEL_ANALYSIS:llama-3.1-8b-instant}
      model-migration: ${GROQ_MODEL_MIGRATION:llama-3.3-70b-versatile}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model-analysis: ${OPENAI_MODEL_ANALYSIS:gpt-4o-mini}
      model-migration: ${OPENAI_MODEL_MIGRATION:gpt-4o}
    anthropic:
      enabled: ${ANTHROPIC_ENABLED:false}
      api-key: ${ANTHROPIC_API_KEY:}
      model-analysis: ${ANTHROPIC_MODEL_ANALYSIS:claude-haiku-4-5-20251001}
      model-migration: ${ANTHROPIC_MODEL_MIGRATION:claude-sonnet-4-6}
    ollama:
      enabled: ${OLLAMA_ENABLED:false}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-analysis: ${OLLAMA_MODEL_ANALYSIS:llama3.2:3b}
      model-migration: ${OLLAMA_MODEL_MIGRATION:llama3.1:8b}
  # Delay between agents in ms (0 = off; set >0 only for Groq free-tier rate-limit guard)
  inter-agent-delay-ms: ${AI_INTER_AGENT_DELAY_MS:0}

websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
