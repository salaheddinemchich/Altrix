server:
  port: 8084

spring:
  application:
    name: platform-orchestrator

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user,user:email,repo
          # GitLab is optional. Spring Boot validates every registration at startup,
          # so the defaults below are non-empty placeholders ("disabled-…") that let
          # the app boot without GitLab configured. Set GITLAB_CLIENT_ID and
          # GITLAB_CLIENT_SECRET in your .env to enable login via GitLab.
          gitlab:
            client-id: ${GITLAB_CLIENT_ID:disabled-gitlab-client-id}
            client-secret: ${GITLAB_CLIENT_SECRET:disabled-gitlab-client-secret}
            scope: read_user,read_api,read_repository
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: GitLab
        provider:
          github:
            user-info-uri: https://api.github.com/user
          gitlab:
            authorization-uri: ${GITLAB_AUTH_URI:https://gitlab.com/oauth/authorize}
            token-uri:         ${GITLAB_TOKEN_URI:https://gitlab.com/oauth/token}
            user-info-uri:     ${GITLAB_USERINFO_URI:https://gitlab.com/api/v4/user}
            user-name-attribute: id

  datasource:
    # stringtype=unspecified lets the PostgreSQL JDBC driver send Java Strings
    # as PG type `unspecified`, so server-side coercion can drop them into
    # `jsonb` columns (workflow_sessions.plan, workflow_sessions.migrated_files,
    # ai_call_ledger.*, …) without an explicit ::jsonb cast on every insert.
    url:      jdbc:postgresql://localhost:5432/${POSTGRES_DB:altrix_db}?stringtype=unspecified
    username: ${POSTGRES_USER:altrix}
    password: ${POSTGRES_PASSWORD:altrix_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_pass}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:4}
          min-idle: ${REDIS_POOL_MIN_IDLE:1}
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}
        shutdown-timeout: 200ms

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: platform-orchestrator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

kafka:
  topics:
    job-created: migration.job.created
    job-status-update: migration.job.status.update

minio:
  endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:password123}
  bucket:
    projects: altrix-projects

encryption:
  provider-config:
    # Base64-encoded 32-byte AES-256 key. Generate with:
    #   openssl rand -base64 32
    # Required only when saving custom API keys via the /api/ai/providers endpoint.
    key: ${PROVIDER_CONFIG_ENCRYPTION_KEY:}

ai:
  providers:
    # ── Free-tier providers (rate-limited, no-cost) ──────────────────────────
    groq:
      enabled: true
      api-key: ${GROQ_API_KEY:${AI_PROVIDER_API_KEY:}}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model-analysis:  ${GROQ_MODEL_ANALYSIS:llama-3.1-8b-instant}
      model-migration: ${GROQ_MODEL_MIGRATION:llama-3.3-70b-versatile}
      timeout-seconds: ${GROQ_TIMEOUT_SECONDS:120}
      temperature:     ${GROQ_TEMPERATURE:0.1}
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      model-analysis:  ${DEEPSEEK_MODEL_ANALYSIS:deepseek-chat}
      model-migration: ${DEEPSEEK_MODEL_MIGRATION:deepseek-reasoner}
      timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:180}
      temperature:     ${DEEPSEEK_TEMPERATURE:0.1}
    ollama:
      enabled: ${OLLAMA_ENABLED:false}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-analysis:  ${OLLAMA_MODEL_ANALYSIS:llama3.2:3b}
      model-migration: ${OLLAMA_MODEL_MIGRATION:llama3.1:8b}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:300}
      # Set to true to warm up Ollama models on startup (avoids first-call latency)
      warmup: ${OLLAMA_WARMUP:false}
    # ── Paid providers (higher quality, per-token billing) ───────────────────
    nvidia:
      enabled: ${NVIDIA_ENABLED:false}
      api-key: ${NVIDIA_API_KEY:}
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      # ANALYSIS tier  — fast/cheap model for short reasoning steps (Agents 1, 2, 4)
      # MIGRATION tier — large model for high-quality code rewriting (Agent 3)
      model-analysis:  ${NVIDIA_MODEL_ANALYSIS:meta/llama-3.1-8b-instruct}
      model-migration: ${NVIDIA_MODEL_MIGRATION:nvidia/llama-3.3-nemotron-super-49b-v1}
      timeout-seconds: ${NVIDIA_TIMEOUT_SECONDS:180}
      temperature:     ${NVIDIA_TEMPERATURE:0.1}
    openrouter:
      enabled: ${OPENROUTER_ENABLED:false}
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      # OpenRouter routes by model id. Defaults pick a strong code/migration model.
      model-analysis:  ${OPENROUTER_MODEL_ANALYSIS:meta-llama/llama-3.1-8b-instruct}
      model-migration: ${OPENROUTER_MODEL_MIGRATION:anthropic/claude-3.5-sonnet}
      timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:180}
      temperature:     ${OPENROUTER_TEMPERATURE:0.1}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ""
      model-analysis:  ${OPENAI_MODEL_ANALYSIS:gpt-4o-mini}
      model-migration: ${OPENAI_MODEL_MIGRATION:gpt-4o}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:120}
      temperature:     ${OPENAI_TEMPERATURE:0.1}
    anthropic:
      enabled: ${ANTHROPIC_ENABLED:false}
      api-key: ${ANTHROPIC_API_KEY:}
      model-analysis:  ${ANTHROPIC_MODEL_ANALYSIS:claude-haiku-4-5-20251001}
      model-migration: ${ANTHROPIC_MODEL_MIGRATION:claude-sonnet-4-6}
      timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:120}
      temperature:     ${ANTHROPIC_TEMPERATURE:0.1}

  # Maximum tokens per Agent 3 context pass. If pruned files exceed this, the pruner
  # truncates to the budget (batching across passes is a future enhancement, #27).
  max-context-tokens: ${AI_MAX_CONTEXT_TOKENS:32000}

  routing:
    # TIER_PREFERENCE (default) or EXPLICIT_ORDER
    strategy: ${AI_ROUTING_STRATEGY:TIER_PREFERENCE}
    # When strategy=TIER_PREFERENCE: PAID_FIRST (quality) or FREE_FIRST (cost)
    tier-preference: ${AI_ROUTING_TIER_PREFERENCE:PAID_FIRST}
    # When strategy=EXPLICIT_ORDER: ordered list of provider IDs
    explicit-order: ${AI_ROUTING_EXPLICIT_ORDER:}
    circuit-breaker:
      sliding-window-size:        ${AI_CB_WINDOW:10}
      failure-rate-threshold:     ${AI_CB_FAILURE_RATE:50}
      wait-duration-open-seconds: ${AI_CB_WAIT_SECONDS:30}
      permitted-calls-half-open:  ${AI_CB_HALF_OPEN_CALLS:3}
    retry:
      max-attempts:        ${AI_RETRY_MAX:2}
      wait-duration-millis: ${AI_RETRY_WAIT_MS:1000}
    bulkhead:
      # Max concurrent ANALYSIS calls (fast-model) across all agents
      analysis-concurrency:  ${AI_BULKHEAD_ANALYSIS:3}
      # Max concurrent MIGRATION calls (powerful-model) across all agents
      migration-concurrency: ${AI_BULKHEAD_MIGRATION:5}
      # Max wait time (ms) for a bulkhead permit before BulkheadFullException
      max-wait-ms: ${AI_BULKHEAD_MAX_WAIT_MS:5000}

  # Delay between agents in ms (0 = off; raise only for single-provider Groq free-tier)
  inter-agent-delay-ms: ${AI_INTER_AGENT_DELAY_MS:0}

  plan-similarity:
    threshold: ${AI_PLAN_SIMILARITY_THRESHOLD:0.85}   # Jaccard threshold, 0–1

  mcp:
    # Set to true to enable MCP (Model Context Protocol) agentic tool calls.
    enabled: ${AI_MCP_ENABLED:false}
    # Maximum number of model↔tool round-trips before the loop is aborted.
    max-tool-iterations: ${AI_MCP_MAX_TOOL_ITERATIONS:5}
    # List MCP servers that the AI pipeline may call.
    # Each server must expose an HTTP endpoint that accepts JSON-RPC 2.0 POST
    # requests (MCP Streamable HTTP transport, spec 2024-11-05).
    #
    # servers:
    #   - name: filesystem
    #     base-url: ${MCP_FILESYSTEM_URL:http://localhost:3001/mcp}
    #     timeout-seconds: 30
    #   - name: git
    #     base-url: ${MCP_GIT_URL:http://localhost:3002/mcp}
    #     timeout-seconds: 15
    servers:

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080}

websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080}

approval:
  timeout: ${APPROVAL_TIMEOUT:30m}
  scheduler-cron: ${APPROVAL_SCHEDULER_CRON:0 * * * * *}
  notification:
    enabled: ${APPROVAL_NOTIFICATION_ENABLED:false}
    reviewer-email: ${APPROVAL_REVIEWER_EMAIL:}
    from-email: ${APPROVAL_FROM_EMAIL:altrix-noreply@localhost}
    base-url: ${APPROVAL_BASE_URL:http://localhost:4200}

jwt:
  # RS256 keys — Base64-encoded DER. Generate with:
  #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
  #   openssl pkcs8 -topk8 -nocrypt -in private.pem -outform DER | base64 -w0
  #   openssl rsa -in private.pem -pubout -outform DER | base64 -w0
  # Leave blank in dev — an ephemeral keypair is generated automatically (logged at WARN).
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}
  refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}

security:
  rate-limit:
    auth-max-requests: ${RATE_LIMIT_AUTH_MAX:10}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW:60}
    api-max-requests: ${RATE_LIMIT_API_MAX:200}
    api-window-seconds: ${RATE_LIMIT_API_WINDOW:60}
  brute-force:
    max-attempts: ${BRUTE_FORCE_MAX_ATTEMPTS:5}
    window-seconds: ${BRUTE_FORCE_WINDOW:300}
  refresh-token:
    cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}

billing:
  mv-refresh-cron: ${BILLING_MV_REFRESH_CRON:0 0 * * * *}

# Frontend URL where the OAuth2 success handler redirects after login
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:4200/auth/callback}

workflow:
  auto-pause:
    threshold: ${AUTO_PAUSE_THRESHOLD:3}

# ── Cache TTL and health monitoring (#157) ─────────────────────────────────────
cache:
  ttl:
    context-analysis: ${CACHE_TTL_CONTEXT_ANALYSIS:PT1H}    # ISO-8601 duration, default 1 h
    migration-plan:   ${CACHE_TTL_MIGRATION_PLAN:PT24H}     # ISO-8601 duration, default 24 h
  health:
    check-interval-ms: ${CACHE_HEALTH_INTERVAL_MS:300000}   # 5 min
    min-hit-rate:      ${CACHE_HEALTH_MIN_HIT_RATE:0.20}    # alert below 20%
    min-samples:       ${CACHE_HEALTH_MIN_SAMPLES:10}       # skip alert before 10 ops
    alert-enabled:     ${CACHE_HEALTH_ALERT_ENABLED:false}
    ops-email:         ${CACHE_HEALTH_OPS_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    # Approval-email SMTP is opt-in (approval.notification.enabled=false by default).
    # Don't fail the health probe when no local mail catcher is running.
    mail:
      enabled: false

# ── RAG / Embedding ────────────────────────────────────────────────────────────
platform-project:
  base-url: ${PLATFORM_PROJECT_URL:http://localhost:8082}

rag:
  embedding:
    provider: ${RAG_EMBEDDING_PROVIDER:openai}   # openai | ollama
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${RAG_EMBEDDING_MODEL_OLLAMA:nomic-embed-text}
