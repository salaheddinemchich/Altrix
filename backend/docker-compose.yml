services:

  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: altrix-postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./infra/postgres-config/02_perf_tuning.sql:/docker-entrypoint-initdb.d/02_perf_tuning.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - altrix-net

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: altrix-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@altrix.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - altrix-net

  # ── Cache ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2.7-alpine
    container_name: altrix-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - altrix-net

  redis-insight:
    image: redislabs/redisinsight:2.60
    container_name: altrix-redis-ui
    ports:
      - "8001:8001"
    networks:
      - altrix-net

  # ── Messaging ─────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: altrix-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID:                          1
      KAFKA_PROCESS_ROLES:                    broker,controller
      KAFKA_LISTENERS:                        PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:         1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:        CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - altrix-net

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: altrix-kafdrop
    ports:
      - "9002:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - altrix-net

  # ── Object Storage ────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: altrix-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - altrix-net

  # ── GCP PubSub Emulator ───────────────────────────────────────────────────
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: altrix-pubsub-emulator
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    networks:
      - altrix-net

  # ── SonarQube ─────────────────────────────────────────────────────────────
  sonarqube-db:
    image: postgres:16.8-alpine
    container_name: altrix-sonarqube-db
    environment:
      POSTGRES_USER:     sonar
      POSTGRES_PASSWORD: ${SONAR_JDBC_PASSWORD}
      POSTGRES_DB:       sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - altrix-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: altrix-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9003:9000"
    environment:
      SONAR_JDBC_URL:      jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | python3 -c \"import sys,json; s=json.load(sys.stdin); sys.exit(0 if s.get('status') in ['UP','STARTING'] else 1)\""]
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 120s
    networks:
      - altrix-net

  # ── DefectDojo ────────────────────────────────────────────────────────────
  defectdojo-db:
    image: postgres:16.8-alpine
    container_name: altrix-defectdojo-db
    environment:
      POSTGRES_USER:     defectdojo
      POSTGRES_PASSWORD: ${DD_DB_PASSWORD}
      POSTGRES_DB:       defectdojo
    volumes:
      - defectdojo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo -d defectdojo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - altrix-net

  defectdojo-initializer:
    image: defectdojo/defectdojo-django:2.58.2
    container_name: altrix-defectdojo-init
    depends_on:
      defectdojo-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DD_DATABASE_URL:           postgresql://defectdojo:${DD_DB_PASSWORD}@defectdojo-db:5432/defectdojo
      DD_CELERY_BROKER_URL:      redis://:${REDIS_PASSWORD}@redis:6379/1
      DD_SECRET_KEY:             ${DD_SECRET_KEY}
      DD_CREDENTIAL_AES_256_KEY: ${DD_AES_256_KEY}
      DD_ADMIN_USER:             admin
      DD_ADMIN_PASSWORD:         ${DD_ADMIN_PASSWORD}
      DD_ADMIN_MAIL:             admin@altrix.com
      DD_ALLOWED_HOSTS:          "*"
      DD_DEBUG:                  "False"
      DD_INITIALIZE:             "True"
    entrypoint: ["/wait-for-it.sh", "defectdojo-db:5432", "--", "/entrypoint-initializer.sh"]
    restart: on-failure
    networks:
      - altrix-net

  defectdojo:
    image: defectdojo/defectdojo-django:2.58.2
    container_name: altrix-defectdojo
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
    environment:
      DD_DATABASE_URL:           postgresql://defectdojo:${DD_DB_PASSWORD}@defectdojo-db:5432/defectdojo
      DD_CELERY_BROKER_URL:      redis://:${REDIS_PASSWORD}@redis:6379/1
      DD_SECRET_KEY:             ${DD_SECRET_KEY}
      DD_CREDENTIAL_AES_256_KEY: ${DD_AES_256_KEY}
      DD_ADMIN_USER:             admin
      DD_ADMIN_PASSWORD:         ${DD_ADMIN_PASSWORD}
      DD_ADMIN_MAIL:             admin@altrix.com
      DD_ALLOWED_HOSTS:          "*"
      DD_DEBUG:                  "False"
    entrypoint: ["/wait-for-it.sh", "defectdojo-db:5432", "--", "/entrypoint-uwsgi.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/')\" 2>/dev/null && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - altrix-net
    restart: unless-stopped

  defectdojo-nginx:
    image: defectdojo/defectdojo-nginx:2.58.2
    container_name: altrix-defectdojo-nginx
    depends_on:
      defectdojo:
        condition: service_healthy
    environment:
      DD_UWSGI_HOST: defectdojo
      DD_UWSGI_PORT: "3031"
    ports:
      - "8089:8080"
    networks:
      - altrix-net
    restart: unless-stopped

  defectdojo-celery-worker:
    image: defectdojo/defectdojo-django:2.58.2
    container_name: altrix-defectdojo-celery-worker
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
    environment:
      DD_DATABASE_URL:           postgresql://defectdojo:${DD_DB_PASSWORD}@defectdojo-db:5432/defectdojo
      DD_CELERY_BROKER_URL:      redis://:${REDIS_PASSWORD}@redis:6379/1
      DD_SECRET_KEY:             ${DD_SECRET_KEY}
      DD_CREDENTIAL_AES_256_KEY: ${DD_AES_256_KEY}
      DD_ALLOWED_HOSTS:          "*"
      DD_DEBUG:                  "False"
    entrypoint: ["/wait-for-it.sh", "defectdojo-db:5432", "--", "/entrypoint-celery-worker.sh"]
    networks:
      - altrix-net
    restart: unless-stopped

  defectdojo-celery-beat:
    image: defectdojo/defectdojo-django:2.58.2
    container_name: altrix-defectdojo-celery-beat
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
    environment:
      DD_DATABASE_URL:           postgresql://defectdojo:${DD_DB_PASSWORD}@defectdojo-db:5432/defectdojo
      DD_CELERY_BROKER_URL:      redis://:${REDIS_PASSWORD}@redis:6379/1
      DD_SECRET_KEY:             ${DD_SECRET_KEY}
      DD_CREDENTIAL_AES_256_KEY: ${DD_AES_256_KEY}
      DD_ALLOWED_HOSTS:          "*"
      DD_DEBUG:                  "False"
    entrypoint: ["/wait-for-it.sh", "defectdojo-db:5432", "--", "/entrypoint-celery-beat.sh"]
    networks:
      - altrix-net
    restart: unless-stopped

# ── Named volumes ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  defectdojo_db_data:

networks:
  altrix-net:
    driver: bridge
