services:

  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.8-alpine
    container_name: migrator-postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - migrator-net

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: migrator-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@migrator.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - migrator-net

  # ── Cache ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2.7-alpine
    container_name: migrator-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - migrator-net

  redis-insight:
    image: redislabs/redisinsight:2.60
    container_name: migrator-redis-ui
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - migrator-net

  # ── Messaging ───────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: migrator-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID:                        1
      KAFKA_PROCESS_ROLES:                  broker,controller
      KAFKA_LISTENERS:                      PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - migrator-net

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: migrator-kafdrop
    ports:
      - "9002:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - migrator-net

  # ── Object Storage ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: migrator-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"\]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - migrator-net

  # ── GCP PubSub Emulator (free, local, zero GCP account needed) ────────────
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: migrator-pubsub-emulator
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085 || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - migrator-net

  # ── SonarQube (code quality — runs locally, CI sends reports here) ──────────
  sonarqube-db:
    image: postgres:16.8-alpine
    container_name: migrator-sonarqube-db
    environment:
      POSTGRES_USER:     sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB:       sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - migrator-net

  sonarqube:
    image: sonarqube:10.6-community
    container_name: migrator-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9003:9000"
    environment:
      SONAR_JDBC_URL:      jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - migrator-net

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  migrator-net:
    driver: bridge
