# Issue #113 — Nginx server block for the Angular SPA.
#
# Lives at /etc/nginx/conf.d/altrix.conf inside the runtime image.
# API calls are NOT proxied here — once platform-gateway (#24) is live they
# will route through it; in the meantime each backend service is reached
# directly via CORS using the absolute URLs set in environment.prod.ts.

server {
    listen      80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # Acceptance criteria from #113:
    add_header X-Frame-Options          "DENY"        always;
    add_header X-Content-Type-Options   "nosniff"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # Conservative default — relaxes only `connect-src` so the SPA can reach
    # backend services and the WebSocket endpoint.  Tighten further once
    # platform-gateway gives every call a single origin.
    add_header Content-Security-Policy  "default-src 'self'; \
        script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
        style-src 'self' 'unsafe-inline'; \
        img-src 'self' data: blob: https:; \
        font-src 'self' data:; \
        connect-src 'self' http: https: ws: wss:; \
        frame-ancestors 'none'; \
        base-uri 'self'; \
        form-action 'self'" always;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml font/woff2;

    # ── Long-cache for fingerprinted assets ─────────────────────────────────
    # Angular's production build hashes asset filenames (outputHashing: "all"),
    # so it is safe to cache them aggressively.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|map)$ {
        expires    1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── No-cache for index.html ─────────────────────────────────────────────
    # The HTML shell must be revalidated on every load so deploys take effect
    # immediately for already-open tabs.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        expires    0;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Any path that isn't a real file is served as index.html so Angular's
    # client-side router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Hide nginx version in Server header ─────────────────────────────────
    server_tokens off;
}
