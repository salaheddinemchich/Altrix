server:
  port: 8084

spring:
  application:
    name: platform-orchestrator

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: platform-orchestrator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

kafka:
  topics:
    job-created: migration.job.created
    job-status-update: migration.job.status.update

minio:
  endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:password123}
  bucket:
    projects: migrator-projects

ai:
  provider:
    base-url: ${AI_PROVIDER_BASE_URL:https://api.groq.com/openai/v1}
    api-key:  ${AI_PROVIDER_API_KEY:}
    # Fast small model for Agent 1 (analysis) — uses fewer tokens
    model-fast: ${AI_PROVIDER_MODEL_FAST:llama-3.1-8b-instant}
    # Powerful model for Agent 3 (actual code rewrite)
    model-main: ${AI_PROVIDER_MODEL:llama-3.3-70b-versatile}
  # Delay between agents in milliseconds — prevents Groq 429 rate limit
  inter-agent-delay-ms: ${AI_INTER_AGENT_DELAY_MS:65000}

websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
