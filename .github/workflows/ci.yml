name: CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io

jobs:

  # ── 1. Build & Test ──────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Set version
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build (skip tests)
        run: ./gradlew build -x test --parallel --no-daemon

      - name: Run tests with JaCoCo coverage
        run: |
          ./gradlew \
            :platform-common:test     :platform-common:jacocoTestReport \
            :platform-project:test    :platform-project:jacocoTestReport \
            :platform-job:test        :platform-job:jacocoTestReport \
            :platform-orchestrator:test :platform-orchestrator:jacocoTestReport \
            --parallel --no-daemon --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ steps.version.outputs.sha }}
          path: "**/build/reports/tests/"
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ steps.version.outputs.sha }}
          path: "**/build/reports/jacoco/"
          retention-days: 14

  # ── 2. SonarQube Analysis ────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build with coverage
        run: |
          ./gradlew build \
            :platform-common:jacocoTestReport \
            :platform-project:jacocoTestReport \
            :platform-job:jacocoTestReport \
            :platform-orchestrator:jacocoTestReport \
            --parallel --no-daemon --continue

      - name: SonarQube Scan
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./gradlew sonar --no-daemon \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}"

  # ── 3. Docker Build & Push ───────────────────────────────────────────────────
  docker-build:
    name: Docker — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: platform-project
            dockerfile: infra/docker/Dockerfile.platform-project
          - name: platform-job
            dockerfile: infra/docker/Dockerfile.platform-job
          - name: platform-orchestrator
            dockerfile: infra/docker/Dockerfile.platform-orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pubsub-kafka-migrator/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: true
          sbom: true

  # ── 4. Deploy to Staging ─────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ docker-build, sonarqube ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: http://$\{\{ secrets.STAGING_HOST }}:8082/actuator/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/pubsub-kafka-migrator

            docker pull ghcr.io/${{ github.repository_owner }}/pubsub-kafka-migrator/platform-project:latest
            docker pull ghcr.io/${{ github.repository_owner }}/pubsub-kafka-migrator/platform-job:latest
            docker pull ghcr.io/${{ github.repository_owner }}/pubsub-kafka-migrator/platform-orchestrator:latest

            docker compose up -d --no-deps --force-recreate \
              platform-project platform-job platform-orchestrator

            sleep 15
            curl -sf http://localhost:8082/actuator/health | grep '"status":"UP"'
            curl -sf http://localhost:8083/actuator/health | grep '"status":"UP"'
            curl -sf http://localhost:8084/actuator/health | grep '"status":"UP"'
            echo "Deployment successful."
