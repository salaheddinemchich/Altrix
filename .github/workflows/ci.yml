name: CI — Build, Test, Analyze

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:

  # ── Build & Test ─────────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build all modules (skip tests)
        run: ./gradlew build -x test --parallel

      - name: Run tests
        run: ./gradlew test --parallel

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  # ── SonarQube Analysis ────────────────────────────────────────────────────────
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better blame info

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build with coverage
        run: ./gradlew build jacocoTestReport --parallel

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./gradlew sonar \
            -Dsonar.projectKey=pubsub-kafka-migrator \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

  # ── Docker Build ──────────────────────────────────────────────────────────────
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform-project
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.platform-project
          push: true
          tags: ghcr.io/${{ github.repository }}/platform-project:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push platform-job
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.platform-job
          push: true
          tags: ghcr.io/${{ github.repository }}/platform-job:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push platform-orchestrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.platform-orchestrator
          push: true
          tags: ghcr.io/${{ github.repository }}/platform-orchestrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
