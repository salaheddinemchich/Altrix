name: CI

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

# ── Global env ────────────────────────────────────────────────────────────────
env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io

# Minimal global permissions — each job declares only what it needs
permissions:
  contents: read

# ══════════════════════════════════════════════════════════════════════════════
# TIER 1  — run in parallel immediately on every push / PR
# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── Secret Scan ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-gitleaks
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 14

  # ── Build & Test ─────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - run: chmod +x gradlew

      - id: sha
        working-directory: .
        run: echo "value=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build -x test --parallel --no-daemon

      - name: Test & Coverage
        run: |
          ./gradlew \
            :platform-common:test     :platform-common:jacocoTestReport \
            :platform-project:test    :platform-project:jacocoTestReport \
            :platform-job:test        :platform-job:jacocoTestReport \
            :platform-orchestrator:test :platform-orchestrator:jacocoTestReport \
            --parallel --no-daemon --continue

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: build-libs-${{ steps.sha.outputs.value }}
          path: "**/build/libs/*.jar"
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-tests-${{ steps.sha.outputs.value }}
          path: "**/build/reports/tests/"
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-coverage-${{ steps.sha.outputs.value }}
          path: "**/build/reports/jacoco/"
          retention-days: 14

  # ── SAST — Semgrep ───────────────────────────────────────────────────────────
  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep --quiet

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/secrets \
            --json \
            --output semgrep.json \
            backend 2>&1 || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-semgrep
          path: semgrep.json
          if-no-files-found: ignore
          retention-days: 14

  # ── SCA — Dependency CVEs ────────────────────────────────────────────────────
  sca:
    name: SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          vuln-type: library
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy-fs
          path: trivy-fs.json
          if-no-files-found: ignore
          retention-days: 14

# ══════════════════════════════════════════════════════════════════════════════
# TIER 2  — Docker build & push (main branch only, after Tier 1 passes)
# ══════════════════════════════════════════════════════════════════════════════

  docker:
    name: Docker / ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [build-test, sast, sca]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: platform-project
            dockerfile: backend/infra/docker/Dockerfile.platform-project
          - name: platform-job
            dockerfile: backend/infra/docker/Dockerfile.platform-job
          - name: platform-orchestrator
            dockerfile: backend/infra/docker/Dockerfile.platform-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/altrix/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

# ══════════════════════════════════════════════════════════════════════════════
# TIER 3  — Container scan (main branch only, after Docker push)
# ══════════════════════════════════════════════════════════════════════════════

  container-scan:
    name: Container Scan / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [platform-project, platform-job, platform-orchestrator]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/altrix/${{ matrix.service }}:latest
          format: json
          output: trivy-image-${{ matrix.service }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy-image-${{ matrix.service }}
          path: trivy-image-${{ matrix.service }}.json
          if-no-files-found: ignore
          retention-days: 14

# ══════════════════════════════════════════════════════════════════════════════
# TIER 4  — Staging deploy (main + STAGING_ENABLED=true)
# ══════════════════════════════════════════════════════════════════════════════

  deploy-staging:
    name: Deploy / Staging
    runs-on: ubuntu-latest
    needs: [docker, container-scan]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.STAGING_ENABLED == 'true'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/altrix

            docker pull ghcr.io/${{ github.repository_owner }}/altrix/platform-project:latest
            docker pull ghcr.io/${{ github.repository_owner }}/altrix/platform-job:latest
            docker pull ghcr.io/${{ github.repository_owner }}/altrix/platform-orchestrator:latest

            docker compose up -d --no-deps --force-recreate \
              platform-project platform-job platform-orchestrator

            # Rotate DefectDojo secrets in .env before restarting it
            grep -v '^DD_' .env > .env.tmp && mv .env.tmp .env
            printf 'DD_DB_PASSWORD=%s\nDD_SECRET_KEY=%s\nDD_AES_256_KEY=%s\nDD_ADMIN_PASSWORD=%s\n' \
              "${DD_DB_PASSWORD}" "${DD_SECRET_KEY}" "${DD_AES_256_KEY}" "${DD_ADMIN_PASSWORD}" >> .env

            docker pull defectdojo/defectdojo-django:latest
            docker compose up -d \
              defectdojo-db defectdojo-initializer \
              defectdojo defectdojo-celery-worker defectdojo-celery-beat

            echo "Deploy complete"
        env:
          DD_DB_PASSWORD:    ${{ secrets.DD_DB_PASSWORD }}
          DD_SECRET_KEY:     ${{ secrets.DD_SECRET_KEY }}
          DD_AES_256_KEY:    ${{ secrets.DD_AES_256_KEY }}
          DD_ADMIN_PASSWORD: ${{ secrets.DD_ADMIN_PASSWORD }}

# ══════════════════════════════════════════════════════════════════════════════
# TIER 5  — DAST (after staging is live)
# ══════════════════════════════════════════════════════════════════════════════

  dast:
    name: DAST
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.STAGING_ENABLED == 'true'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Wait for staging health
        run: |
          for i in $(seq 1 18); do
            if curl -sf "http://${{ secrets.STAGING_HOST }}:8082/actuator/health" \
                | grep -q '"status":"UP"'; then
              echo "Staging is UP"; break
            fi
            echo "  attempt $i/18 — waiting 10s"
            sleep 10
          done

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://${{ secrets.STAGING_HOST }}:8082"
          rules_file_name: ".github/zap-rules.tsv"
          cmd_options: "-I"
          allow_issue_writing: false
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-zap
          path: report_json.json
          if-no-files-found: ignore
          retention-days: 14

# ══════════════════════════════════════════════════════════════════════════════
# TIER 6  — Findings aggregation into DefectDojo (main only, always runs)
# ══════════════════════════════════════════════════════════════════════════════

  defectdojo:
    name: Findings / DefectDojo
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, container-scan, dast]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEFECTDOJO_URL != ''
    steps:
      - name: Download all scan reports
        uses: actions/download-artifact@v4
        with:
          pattern: "report-*"
          merge-multiple: false
          path: scan-artifacts
        continue-on-error: true

      - name: Upload findings to DefectDojo
        env:
          DD_URL:    ${{ vars.DEFECTDOJO_URL }}
          DD_KEY:    ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_PRODUCT: Altrix
          DD_ENG:    "CI-${{ github.run_number }}-${{ github.sha }}"
          BRANCH:    ${{ github.ref_name }}
          COMMIT:    ${{ github.sha }}
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)

          # Resolve or create product
          curl -sf -X POST "${DD_URL}/api/v2/products/" \
            -H "Authorization: Token ${DD_KEY}" -H "Content-Type: application/json" \
            -d "{\"name\":\"${DD_PRODUCT}\",\"description\":\"Altrix — AI migration platform\",\"prod_type\":1}" \
            -o /dev/null || true

          PRODUCT_ID=$(curl -sf "${DD_URL}/api/v2/products/?name=${DD_PRODUCT}&limit=1" \
            -H "Authorization: Token ${DD_KEY}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['id'])")

          # Create engagement for this CI run
          ENG_ID=$(curl -sf -X POST "${DD_URL}/api/v2/engagements/" \
            -H "Authorization: Token ${DD_KEY}" -H "Content-Type: application/json" \
            -d "{\"name\":\"${DD_ENG}\",\"product\":${PRODUCT_ID},\"target_start\":\"${TODAY}\",\"target_end\":\"${TODAY}\",\"status\":\"In Progress\",\"engagement_type\":\"CI/CD\",\"commit_hash\":\"${COMMIT}\",\"branch_tag\":\"${BRANCH}\",\"build_id\":\"${{ github.run_id }}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          upload() {
            local type="$1" file="$2" label="$3"
            [ -f "$file" ] || { echo "  [SKIP] $label"; return; }
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 --max-time 60 \
              -H "Authorization: Token ${DD_KEY}" \
              -F "scan_type=${type}" -F "file=@${file}" \
              -F "engagement=${ENG_ID}" -F "test_title=${label}" \
              -F "active=true" -F "verified=false" -F "close_old_findings=false" \
              "${DD_URL}/api/v2/import-scan/" 2>/dev/null) || STATUS=0
            echo "  [$STATUS] $label"
          }

          upload "Gitleaks Scan"       "scan-artifacts/report-gitleaks/results.sarif"         "Gitleaks"
          upload "Semgrep JSON Report" "scan-artifacts/report-semgrep/semgrep.json"            "Semgrep SAST"
          upload "Trivy Scan"          "scan-artifacts/report-trivy-fs/trivy-fs.json"          "Trivy FS"
          for svc in platform-project platform-job platform-orchestrator; do
            upload "Trivy Scan" "scan-artifacts/report-trivy-image-${svc}/trivy-image-${svc}.json" "Trivy Image (${svc})"
          done
          upload "ZAP Scan"            "scan-artifacts/report-zap/report_json.json"            "OWASP ZAP"

          curl -sf -X PATCH "${DD_URL}/api/v2/engagements/${ENG_ID}/" \
            -H "Authorization: Token ${DD_KEY}" -H "Content-Type: application/json" \
            -d '{"status":"Completed"}' -o /dev/null || true

          echo "DefectDojo: ${DD_URL}/engagement/${ENG_ID}"

# ══════════════════════════════════════════════════════════════════════════════
# STATUS GATE  — single required check for branch protection rules
#
# Set this as the only required status check in GitHub → Settings →
# Branches → "Require status checks" → search "CI / Gate".
# It passes only when all Tier-1 jobs succeed.
# ══════════════════════════════════════════════════════════════════════════════

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [secret-scan, build-test, sast, sca]
    if: always()
    steps:
      - name: Evaluate required checks
        run: |
          results=(
            "secret-scan:${{ needs.secret-scan.result }}"
            "build-test:${{ needs.build-test.result }}"
            "sast:${{ needs.sast.result }}"
            "sca:${{ needs.sca.result }}"
          )
          failed=0
          for entry in "${results[@]}"; do
            job="${entry%%:*}"
            result="${entry##*:}"
            if [[ "$result" != "success" ]]; then
              echo "FAIL  $job ($result)"
              failed=1
            else
              echo "OK    $job"
            fi
          done
          [[ $failed -eq 0 ]] || { echo ""; echo "One or more required checks failed."; exit 1; }
          echo ""
          echo "All required checks passed."
