name: CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/pubsub-kafka-migrator

jobs:

  # ── 1. Build & Test ──────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for SonarQube blame

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build all modules
        run: ./gradlew build -x test --parallel --no-daemon

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport --parallel --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/build/reports/jacoco/"
          retention-days: 7

  # ── 2. SonarQube Analysis ────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    # Run on main pushes and PRs to main
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build and generate coverage for SonarQube
        run: ./gradlew build jacocoTestReport --parallel --no-daemon

      - name: Run SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./gradlew sonar \
            --no-daemon \
            -Dsonar.projectKey=pubsub-kafka-migrator \
            -Dsonar.projectName="PubSub to Kafka Migrator" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=platform-common/src/main,platform-project/src/main,platform-job/src/main,platform-orchestrator/src/main \
            -Dsonar.tests=platform-common/src/test,platform-project/src/test,platform-job/src/test,platform-orchestrator/src/test \
            -Dsonar.java.binaries=platform-common/build/classes/java/main,platform-project/build/classes/java/main,platform-job/build/classes/java/main,platform-orchestrator/build/classes/java/main \
            -Dsonar.coverage.jacoco.xmlReportPaths=platform-common/build/reports/jacoco/test/jacocoTestReport.xml,platform-project/build/reports/jacoco/test/jacocoTestReport.xml,platform-job/build/reports/jacoco/test/jacocoTestReport.xml,platform-orchestrator/build/reports/jacoco/test/jacocoTestReport.xml \
            -Dsonar.exclusions="**/build/**,**/.gradle/**,**/infra/postgres/**,**/*Application.java"

  # ── 3. Docker Build & Push ───────────────────────────────────────────────────
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: platform-project
            dockerfile: infra/docker/Dockerfile.platform-project
            port: 8082
          - name: platform-job
            dockerfile: infra/docker/Dockerfile.platform-job
            port: 8083
          - name: platform-orchestrator
            dockerfile: infra/docker/Dockerfile.platform-orchestrator
            port: 8084

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pubsub-kafka-migrator/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ── 4. Deploy to Staging ─────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via Docker Compose (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/pubsub-kafka-migrator

            # Pull latest images
            docker pull ghcr.io/${{ github.repository_owner }}/pubsub-kafka-migrator/platform-project:latest
            docker pull ghcr.io/${{ github.repository_owner }}/pubsub-kafka-migrator/platform-job:latest
            docker pull ghcr.io/${{ github.repository_owner }}/pubsub-kafka-migrator/platform-orchestrator:latest

            # Restart services with zero-downtime rolling update
            docker compose up -d --no-deps --force-recreate \
              platform-project platform-job platform-orchestrator

            # Health check
            sleep 10
            docker compose ps
            echo "Deployment complete"
