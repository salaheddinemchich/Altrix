name: CI/CD + DevSecOps Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io

# Minimal global permissions — each job declares only what it needs
permissions:
  contents: read
  actions: read

jobs:

  # ── 0. Secret Scan — Gitleaks ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Archive Gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 14

  # ── 1. Build, Test & Coverage ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - run: chmod +x gradlew

      - id: version
        working-directory: .
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build -x test --parallel --no-daemon

      - name: Test with JaCoCo coverage
        run: |
          ./gradlew \
            :platform-common:test     :platform-common:jacocoTestReport \
            :platform-project:test    :platform-project:jacocoTestReport \
            :platform-job:test        :platform-job:jacocoTestReport \
            :platform-orchestrator:test :platform-orchestrator:jacocoTestReport \
            --parallel --no-daemon --continue

      - name: Upload JARs
        uses: actions/upload-artifact@v7
        with:
          name: build-libs-${{ steps.version.outputs.sha }}
          path: "**/build/libs/*.jar"
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ steps.version.outputs.sha }}
          path: "**/build/reports/tests/"
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ steps.version.outputs.sha }}
          path: "**/build/reports/jacoco/"
          retention-days: 14

  # ── 2. SAST — Semgrep ─────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep --quiet

      - name: Run Semgrep SAST (JSON for DefectDojo native parser)
        run: |
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/secrets \
            --json \
            --output semgrep.json \
            backend 2>&1 || true

      - name: Archive Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: ignore
          retention-days: 14

  # ── 3. SCA — Trivy filesystem (dependency CVEs) ───────────────────────────
  sca:
    name: SCA (Trivy — Dependencies)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan (JSON for DefectDojo native parser)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          vuln-type: library
        continue-on-error: true

      - name: Archive SCA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-report
          path: trivy-fs.json
          if-no-files-found: ignore
          retention-days: 14

  # ── 4. Docker Build & Push ────────────────────────────────────────────────
  docker-build:
    name: Docker — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [build-and-test, sast, sca]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: platform-project
            dockerfile: backend/infra/docker/Dockerfile.platform-project
          - name: platform-job
            dockerfile: backend/infra/docker/Dockerfile.platform-job
          - name: platform-orchestrator
            dockerfile: backend/infra/docker/Dockerfile.platform-orchestrator

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/altrix/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service.name }}

  # ── 5. Container Scan — Trivy image ───────────────────────────────────────
  container-scan:
    name: Container Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        service: [platform-project, platform-job, platform-orchestrator]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scan (JSON for DefectDojo native parser)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/altrix/${{ matrix.service }}:latest
          format: json
          output: trivy-image-${{ matrix.service }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        continue-on-error: true

      - name: Archive container scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-${{ matrix.service }}
          path: trivy-image-${{ matrix.service }}.json
          if-no-files-found: ignore
          retention-days: 14

  # ── 6. Deploy to Staging ──────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, container-scan]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.STAGING_ENABLED == 'true'
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v6
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          envs:     DD_DB_PASSWORD,DD_SECRET_KEY,DD_AES_256_KEY,DD_ADMIN_PASSWORD
          script: |
            set -e
            cd /opt/altrix

            # ── Application services ──────────────────────────────────────
            docker pull ghcr.io/${{ github.repository_owner }}/altrix/platform-project:latest
            docker pull ghcr.io/${{ github.repository_owner }}/altrix/platform-job:latest
            docker pull ghcr.io/${{ github.repository_owner }}/altrix/platform-orchestrator:latest
            docker compose up -d --no-deps --force-recreate \
              platform-project platform-job platform-orchestrator

            # ── DefectDojo (CVE aggregation dashboard) ────────────────────
            # Inject DefectDojo secrets into .env on staging
            grep -v '^DD_' .env > .env.tmp && mv .env.tmp .env
            echo "DD_DB_PASSWORD=${DD_DB_PASSWORD}"   >> .env
            echo "DD_SECRET_KEY=${DD_SECRET_KEY}"     >> .env
            echo "DD_AES_256_KEY=${DD_AES_256_KEY}"   >> .env
            echo "DD_ADMIN_PASSWORD=${DD_ADMIN_PASSWORD}" >> .env

            docker pull defectdojo/defectdojo-django:latest
            docker compose up -d \
              defectdojo-db defectdojo-initializer \
              defectdojo defectdojo-celery-worker defectdojo-celery-beat

            echo "Deployment complete — DefectDojo at http://${{ secrets.STAGING_HOST }}:8089"
        env:
          DD_DB_PASSWORD:   ${{ secrets.DD_DB_PASSWORD }}
          DD_SECRET_KEY:    ${{ secrets.DD_SECRET_KEY }}
          DD_AES_256_KEY:   ${{ secrets.DD_AES_256_KEY }}
          DD_ADMIN_PASSWORD: ${{ secrets.DD_ADMIN_PASSWORD }}

  # ── 7. DAST — OWASP ZAP baseline scan ────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.STAGING_ENABLED == 'true'

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Wait for staging to be ready
        run: |
          echo "Waiting for platform-project to be healthy..."
          for i in $(seq 1 18); do
            if curl -sf "http://${{ secrets.STAGING_HOST }}:8082/actuator/health" \
                | grep -q '"status":"UP"'; then
              echo "Service is UP"
              break
            fi
            echo "  attempt $i/18 — sleeping 10s"
            sleep 10
          done

      - name: ZAP Baseline Scan — platform-project API
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://${{ secrets.STAGING_HOST }}:8082'
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-I'
          allow_issue_writing: false
        continue-on-error: true

      - name: Archive ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: report_json.json
          if-no-files-found: ignore
          retention-days: 14

  # ── 8. DefectDojo — Aggregate all findings ────────────────────────────────
  defectdojo-upload:
    name: Upload to DefectDojo
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, container-scan, dast]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEFECTDOJO_URL != ''

    steps:
      - name: Download all scan artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*report*'
          merge-multiple: false
          path: scan-artifacts

      - name: Download Semgrep artifact
        uses: actions/download-artifact@v8
        with:
          name: semgrep-report
          path: scan-artifacts/semgrep-report
        continue-on-error: true

      - name: Download container scan artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'trivy-image-*'
          merge-multiple: false
          path: scan-artifacts
        continue-on-error: true

      - name: Upload findings to DefectDojo
        env:
          DD_URL: ${{ vars.DEFECTDOJO_URL }}
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_PRODUCT: Altrix
          DD_ENGAGEMENT: "CI-${{ github.run_number }}-${{ github.sha }}"
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)

          # ── Resolve product (create if missing) ─────────────────────────
          curl -s -X POST "${DD_URL}/api/v2/products/" \
            -H "Authorization: Token ${DD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${DD_PRODUCT}\",\"description\":\"AI-powered migration platform — automated codebase analysis, planning, transformation, and validation across any stack.\",\"prod_type\":1}" \
            -o /dev/null 2>/dev/null || true

          PRODUCT_ID=$(curl -s "${DD_URL}/api/v2/products/?name=${DD_PRODUCT}&limit=1" \
            -H "Authorization: Token ${DD_API_KEY}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['id'])")
          echo "Product '${DD_PRODUCT}' (id=${PRODUCT_ID})"

          # ── Create engagement for this CI run ───────────────────────────
          ENG_ID=$(curl -s -X POST "${DD_URL}/api/v2/engagements/" \
            -H "Authorization: Token ${DD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${DD_ENGAGEMENT}\",\"product\":${PRODUCT_ID},\"target_start\":\"${TODAY}\",\"target_end\":\"${TODAY}\",\"status\":\"In Progress\",\"engagement_type\":\"CI/CD\",\"commit_hash\":\"${COMMIT}\",\"branch_tag\":\"${BRANCH}\",\"build_id\":\"${{ github.run_id }}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Engagement '${DD_ENGAGEMENT}' (id=${ENG_ID})"

          upload_to_dojo() {
            local scan_type="$1"
            local file="$2"
            local label="$3"

            if [ ! -f "$file" ]; then
              echo "  [SKIP] $label — file not found"
              return 0
            fi

            HTTP_STATUS=$(curl -s -o /tmp/dd-response.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 60 \
              -H "Authorization: Token ${DD_API_KEY}" \
              -F "scan_type=${scan_type}" \
              -F "file=@${file}" \
              -F "engagement=${ENG_ID}" \
              -F "test_title=${label}" \
              -F "active=true" \
              -F "verified=false" \
              -F "close_old_findings=false" \
              "${DD_URL}/api/v2/import-scan/" 2>/dev/null) || true
            HTTP_STATUS="${HTTP_STATUS:-0}"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "  [OK]   $label (HTTP $HTTP_STATUS)"
            else
              echo "  [WARN] $label — HTTP $HTTP_STATUS"
            fi
            return 0
          }

          echo "=== Uploading security findings to DefectDojo at ${DD_URL} ==="

          # Native scan types — richer parsing than generic SARIF
          upload_to_dojo "Gitleaks Scan" \
            "scan-artifacts/gitleaks-report/results.sarif" \
            "Gitleaks — Secret Detection"

          upload_to_dojo "Semgrep JSON Report" \
            "scan-artifacts/semgrep-report/semgrep.json" \
            "Semgrep — SAST"

          upload_to_dojo "Trivy Scan" \
            "scan-artifacts/trivy-fs-report/trivy-fs.json" \
            "Trivy — Dependency CVEs"

          for svc in platform-project platform-job platform-orchestrator; do
            upload_to_dojo "Trivy Scan" \
              "scan-artifacts/trivy-image-${svc}/trivy-image-${svc}.json" \
              "Trivy — Container (${svc})"
          done

          upload_to_dojo "ZAP Scan" \
            "scan-artifacts/zap-report/report_json.json" \
            "OWASP ZAP — DAST"

          # Mark engagement Completed
          curl -s -X PATCH "${DD_URL}/api/v2/engagements/${ENG_ID}/" \
            -H "Authorization: Token ${DD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status":"Completed"}' \
            -o /dev/null 2>/dev/null || true

          echo "=== DefectDojo upload complete ==="
          echo "Dashboard: ${DD_URL}/engagement/${ENG_ID}"
