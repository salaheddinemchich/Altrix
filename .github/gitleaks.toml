# Gitleaks configuration for altrix
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "altrix gitleaks config"

[extend]
# Extend the default rules shipped with gitleaks
useDefault = true

[allowlist]
description = "Allowlist for known-safe patterns in this repository"

regexes = [
  # Spring Boot ${VAR:default_value} property placeholders are not secrets
  '''\$\{[A-Z_]+:[^}]+\}''',
  # Docker-compose env-var pass-through references — value is the var itself, not a secret
  '''SONAR_JDBC_PASSWORD:\s+\$\{SONAR_JDBC_PASSWORD\}''',
  '''PGADMIN_DEFAULT_PASSWORD:\s+\$\{PGADMIN_PASSWORD\}''',
]

# Paths that contain only infrastructure / development defaults
paths = [
  # Test fixtures and integration test resources
  '''.*src/test/.*''',
  # Gitleaks config itself
  '''.github/gitleaks\.toml''',
]
